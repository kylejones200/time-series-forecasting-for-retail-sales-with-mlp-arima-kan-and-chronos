[project]
name = "retail-forecast"
version = "0.2.0"
description = "Retail sales forecasting with ARIMA, MLP, KAN, LSTM, and Chronos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.2.2",
    "pykan>=0.2.8",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pandas-datareader>=0.10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14.6",
    "torch>=2.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
plot = ["signalplot>=0.1.0"]

[project.scripts]
retail-forecast-run = "retail_forecast.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_forecast"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
